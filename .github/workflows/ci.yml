# ─────────────────────────────────────────────────────────────────
# ci.yml  —  Lint, validate, and security-scan on every push / PR
# ─────────────────────────────────────────────────────────────────
name: CI — Lint & Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read          # Least-privilege: read-only for checkout
  security-events: write  # Required to upload SARIF results to Security tab

jobs:
  # ── Job 1: Validate HTML & CSS ────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Pinned to a specific SHA — prevents supply-chain attacks
        # from a compromised tag (e.g. actions/checkout@v4 could be re-tagged)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate src/index.html

  # ── Job 2: Trivy filesystem vulnerability scan ────────────────
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: lint   # Only run if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          # SARIF format lets GitHub show findings in the Security tab
          format: "sarif"
          output: "trivy-results.sarif"
          # Fail the build if any HIGH or CRITICAL CVEs are found
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF report to Security tab
        # Always run this step so findings appear even when the scan fails
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  # ── Job 3: Dependency review on PRs ───────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only meaningful on pull requests — compares base vs head dependencies
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        # Blocks merges if a newly introduced dependency has known CVEs
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
