# ─────────────────────────────────────────────────────────────────
# codeql.yml  —  Static code analysis via GitHub CodeQL
# Runs on push, PRs to main, and weekly on a schedule
# ─────────────────────────────────────────────────────────────────
name: CodeQL Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run every Monday at 08:00 UTC — catches new CVEs against existing code
    - cron: "0 8 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write  # Required to post findings to the Security tab

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # javascript covers JS and TypeScript; add more languages as needed
        language: ["javascript"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          languages: ${{ matrix.language }}
          # Use the security-extended query suite for broader coverage
          # (includes XSS, injection, path traversal, etc.)
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          category: "/language:${{ matrix.language }}"
